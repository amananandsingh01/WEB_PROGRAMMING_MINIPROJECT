<!DOCTYPE html> <html lang="en"> <head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login - CampusSkill</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link rel="stylesheet" href="../css/style.css">

</head> <body> <!-- Navbar --> <nav class="navbar navbar-expand-lg">
<div class="container">

    <a
        class="navbar-brand fs-4"
        href="index.html"
    >
        CampusSkill
    </a>

    <div class="ms-auto">

        <span class="text-muted me-2">
            New here?
        </span>

        <a
            href="register.html"
            class="btn btn-outline-primary"
        >
            Create Account
        </a>

    </div>

</div>

</nav> <!-- Login --> <div class="auth-container">
<div class="auth-card">


    <!-- Heading -->

    <div class="text-center mb-4">

        <div class="avatar mx-auto mb-3">
            🎓
        </div>

        <h2>Welcome back!</h2>

        <p class="text-muted">
            Login to continue your skill exchange journey.
        </p>

    </div>



    <!-- Login form -->

    <form
        id="loginForm"
        onsubmit="handleLogin(event)"
        novalidate
    >


        <!-- Email -->

        <div class="mb-3">

            <label class="form-label">
                College Email
            </label>

            <input
                type="email"
                class="form-control"
                id="loginEmail"
                placeholder="example@college.edu"
                required
            >

            <div class="invalid-feedback">
                Please enter your email.
            </div>

        </div>



        <!-- Password -->

        <div class="mb-3">

            <div class="d-flex justify-content-between">

                <label class="form-label">
                    Password
                </label>

                <a
                    href="#"
                    class="text-decoration-none small"
                >
                    Forgot Password?
                </a>

            </div>


            <input
                type="password"
                class="form-control"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <div class="invalid-feedback">
                Please enter your password.
            </div>

        </div>



        <!-- Remember me -->

        <div class="form-check mb-4">

            <input
                class="form-check-input"
                type="checkbox"
                id="rememberMe"
            >

            <label
                class="form-check-label"
                for="rememberMe"
            >
                Remember me
            </label>

        </div>



        <!-- Login -->

        <button
            type="submit"
            class="btn-primary-custom w-100"
        >
            Login
        </button>


    </form>



    <!-- Register -->

    <div class="text-center mt-4">

        <p class="text-muted mb-0">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </p>

    </div>


</div>

</div> <script src="../js/script.js"></script> </body> </html>
